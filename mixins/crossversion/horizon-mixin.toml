[mod]
id = "crossversion"
version = "0.6.0"
priority = 100

[compatibility]
horizon_revision = "07b7ea30d02973e7bc7579ea1e914dac2a9eca01"

# The pure decisions (how a status becomes a server-list entry): also the
# standalone Cargo library, so they are unit tested on their own.
[[module]]
id = "decisions"
file = "crates/horizon-client/src/net.rs"
name = "crossversion_decisions"
source = "decisions.rs"

# Options > Mods: the row and its settings page.
[[module]]
id = "ui"
file = "crates/horizon-client/src/game/mods.rs"
name = "crossversion_ui"
source = "ui.rs"

# The proxy manager: config, Java discovery, ViaProxy download, spawn/reap.
[[module]]
id = "engine"
file = "crates/horizon-client/src/net.rs"
name = "crossversion"
source = "engine.rs"
visibility = "pub"

# A join: rewrite the address to the loopback proxy when the server is not 26.3.
[[injection]]
id = "route-connect"
target = "horizon_client::net::Session::connect"
kind = "MODIFY_ARG"
selector = "Self::start"
require = 1
ordinal = 0
argument = 0
helper = "route.rs"
bindings = [{ name = "address", ty = "&str", value = "$value" }]

# The same for a transfer (BungeeCord/Velocity forwarding), which carries cookies.
[[injection]]
id = "route-transferred"
target = "horizon_client::net::Session::connect_transferred"
kind = "MODIFY_ARG"
selector = "Self::start"
require = 1
ordinal = 0
argument = 0
helper = "route.rs"
bindings = [{ name = "address", ty = "&str", value = "$value" }]

# The session ended (the player left, or the connection dropped): stop its proxy.
[[injection]]
id = "session-end"
target = "horizon_client::net::Session::disconnect"
kind = "HEAD"
helper = "session_end.rs"
bindings = [{ name = "session", ty = "&crate::net::Session", value = "&*self" }]

# The server list: show a routed server as compatible, with its version.
[[injection]]
id = "ping-badge"
target = "horizon_client::net::ping"
kind = "HEAD"
cancellable = true
helper = "ping.rs"
bindings = [{ name = "address", ty = "&str", value = "address" }]

# Options > Mods: register the row and serve its settings page.
[[injection]]
id = "mods-row"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
kind = "HEAD"
helper = "ui_mods.rs"
bindings = [{ name = "mods", ty = "&mut Vec<NativeMod>", value = "mods" }]

[[injection]]
id = "mods-settings"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
kind = "HEAD"
helper = "ui_settings.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "buttons" },
]

[[injection]]
id = "mods-click"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
kind = "HEAD"
helper = "ui_click.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
