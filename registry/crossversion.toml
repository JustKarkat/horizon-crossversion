id = "crossversion"
kind = "native-mod"
name = "Cross-version"
summary = "Join servers on older Minecraft versions: reads the version, runs ViaProxy locally, and logs in with an account added to the proxy."
description = """
Horizon speaks one protocol, 26.3 (777). This mod lets it join servers that speak an older one.

On a join, it reads the server's version from its status reply. If it is not 26.3, it starts ViaProxy on a loopback port and points the join at it; ViaProxy speaks 26.3 to Horizon and the server's own version to the server. A join to a 26.3 server is never routed, and nothing else about the client changes.

The server list shows what ViaProxy can join: a server whose status says another version keeps its ping bars green and shows its version in green above the MOTD ("PaperSpigot 1.8.8 · via ViaProxy") instead of the red incompatible cross.

Online-mode servers work through an account added to ViaProxy. Horizon never signs a session hash: the proxy logs in with the Microsoft account the player adds to it, once, from Options > Mods > Cross-version > Settings, which shows the Microsoft device code. That is deliberate: answering ViaProxy's OpenAuthMod query instead would mean signing any hash that arrives in a login query, and a server the player joins can send one too, so it could have the client sign a hash for a server it runs and log in as the player there (found in review of 0.4.0). The account and its refresh token live in ViaProxy's own save under horizon-mods/.horizon-mod-data/crossversion/viaproxy/, not in Horizon.

What it downloads and runs (stated plainly):
- ViaProxy 3.4.14, GPL-3.0, from its GitHub release on first use, into horizon-mods/.horizon-mod-data/crossversion/, checked against a SHA-256 pinned in the source. It is not bundled with this mod and is not built from its source.
- Java: an installed Java 17+ is used, or the runtime Horizon already keeps under `<game home>/runtime/` (including the macOS jre.bundle layout). Nothing is downloaded; without Java 17+ the mod does not start the proxy and says why.
- ViaProxy runs as a child process of the game, on 127.0.0.1 only, and is stopped when you leave the server (and by a small pid file after a crash).

Settings live in horizon-mods/.horizon-mod-data/crossversion/config.json: "enabled", "always", and "servers", which names a target version for a network whose front reports the client's own version while its lobbies are older (for example {"minevia.club": "1.8"}). Options > Mods > Cross-version has a settings page that turns the mod on or off and deletes the downloaded ViaProxy.

It does not do: Bedrock servers; old clients joining a Horizon world (that is the other direction); making a non-vanilla client pass server-side anti-cheat; or fixing protocol differences Horizon itself has.

MIT. Requires Java 17+; an internet connection the first time (about 49 MB for ViaProxy); and, for online-mode servers, a Microsoft account added to ViaProxy once."""
