changelog = "Offline mode only. The Microsoft sign-in is removed: it used the official launcher's client id, which Horizon's registry may not ship, and 0.7.1 was revoked for it. On the first use after updating, any account a previous version stored in ViaProxy's saves.json is deleted, together with the old viaproxy/plugins folder. Hardening: the proxy runs in a fresh working directory for each join (nothing from the modpack-writable data folder is loaded, and viaproxy.yml is written fresh), Java is taken only from HORIZON_CROSSVERSION_JAVA, JAVA_HOME, PATH or the system's install folders and never from inside the game folder (a java key in config.json is ignored), and the mod's data folder is Horizon's own. Settings page: on/off and delete the downloaded ViaProxy."
