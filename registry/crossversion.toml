id = "crossversion"
kind = "native-mod"
name = "Cross-version"
summary = "Join older offline-mode servers: picks the version per server and runs ViaProxy locally on a loopback port."
description = """
Horizon speaks one protocol, 26.3 (777). This mod lets it join offline-mode servers that speak an older one.

On a join, it reads the server's version from its status reply. If it is not 26.3, it starts ViaProxy on a loopback port and points the join at it; ViaProxy speaks 26.3 to Horizon and the server's own version to the server. A join to a 26.3 server is never routed, and nothing else about the client changes.

The server list shows what ViaProxy can join: a server whose status says another version keeps its ping bars green and shows its version in green above the MOTD ("PaperSpigot 1.8.8 · via ViaProxy") instead of the red incompatible cross.

Edit Server and Direct Connect carry a version switch under their buttons: it steps through auto, 1.8, 1.9, 1.12.2, 1.16.5, 1.20.1, 1.21.1, 1.21.4 and 26.3 for that address, and keeps the choice. That is the version ViaProxy tells the server it is, which is what a server whose status reports the wrong version needs; Horizon itself always speaks 26.3 to the proxy.

Offline-mode only. Horizon never signs a session hash: answering ViaProxy's OpenAuthMod query would mean signing whatever hash arrives in a login query, and a server a player joins can send one too, so it could have the client sign one for a server it runs (found in review of 0.4.0). Versions 0.6.0–0.7.1 let ViaProxy hold a Microsoft account instead, but that sign-in uses the official launcher's client id, which Horizon's registry may not ship; 0.8.0 removes it, deletes any account a previous version stored in ViaProxy's saves.json the next time the mod is used, and joins offline only.

What it downloads and runs (stated plainly):
- ViaProxy 3.4.14, GPL-3.0, from its GitHub release on first use, into horizon-mods/.horizon-mod-data/crossversion/, checked against a SHA-256 pinned in the source. It is not bundled with this mod and is not built from its source.
- Java: a Java 17+ from HORIZON_CROSSVERSION_JAVA, JAVA_HOME, PATH or the system's install folders. A java inside the game folder (including a `java` key in config.json) is ignored, since modpacks can write there. Nothing is downloaded.
- ViaProxy runs as a child process of the game, on 127.0.0.1 only, in an empty working directory made for that join (its own empty plugins/ folder, viaproxy.yml written fresh), and is stopped when you leave the server (and by a small pid file after a crash).

Settings live in horizon-mods/.horizon-mod-data/crossversion/config.json: "enabled", "always", and "servers", which names a target version for a network whose front reports the client's own version while its lobbies are older (for example {"minevia.club": "1.8"}). Options > Mods > Cross-version has a settings page that turns the mod on or off and deletes the downloaded ViaProxy.

It does not do: online-mode servers; Bedrock servers; old clients joining a Horizon world (that is the other direction); making a non-vanilla client pass server-side anti-cheat; or fixing protocol differences Horizon itself has.

MIT. Requires Java 17+ outside the game folder; an internet connection the first time (about 49 MB for ViaProxy)."""
authors = ["JustKarkat"]
owners = ["JustKarkat"]
license = "MIT"
source = "https://github.com/JustKarkat/horizon-crossversion"
key = "RWTcPJHJYjPW0pV3lPwr45crCu0wJxW5HbDLc3fr3Eom1TzxO++kHOo4"

