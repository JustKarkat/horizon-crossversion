[package]
name = "horizon-crossversion"
version = "0.7.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Cross-version support for Horizon: a native mod that runs ViaProxy locally"

[lib]
# This exact source is also injected as a same-crate module by horizon-mixins.
path = "mixins/crossversion/decisions.rs"

[dependencies]
# The decisions module is also injected into the game, which has this already.
serde_json = "1"

[workspace]
resolver = "2"
